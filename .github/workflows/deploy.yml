name: Test and deploy MCLab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mclab-production
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check non-secret GitHub deployment identity
        run: python deploy/aws/oidc_identity.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Non-secret deployment role; GitHub obtains short-lived credentials using OIDC.
          role-to-assume: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::014679146311:role/mclab-prod-github-deploy' }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-duration-seconds: 1800
          retry-max-attempts: 2
          role-session-name: mclab-github-deploy
      - name: Deploy tested commit without replacing the database host
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          MCLAB_STACK_NAME: ${{ vars.AWS_STACK_NAME || 'mclab-prod' }}
        run: python deploy/aws/update.py
